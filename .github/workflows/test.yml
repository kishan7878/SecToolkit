name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-dev
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt || echo "Some dependencies failed, continuing..."
      continue-on-error: true
    
    - name: Test imports
      run: |
        python -c "from modules.android_security import AndroidSecurity" || echo "Android module import failed"
        python -c "from modules.pentest_tools import PentestTools" || echo "Pentest module import failed"
        python -c "from modules.utility_tools import UtilityTools" || echo "Utility module import failed"
        python -c "from modules.bugbounty_tools import BugBountyTools" || echo "BugBounty module import failed"
        python -c "from modules.dev_tools import DevTools" || echo "Dev module import failed"
      continue-on-error: true
    
    - name: Syntax check
      run: |
        python -m py_compile sectoolkit.py
        python -m py_compile modules/*.py
    
    - name: Print success
      run: |
        echo "✅ Build completed successfully!"
        echo "Repository: SecToolkit"
        echo "Python version: ${{ matrix.python-version }}"
